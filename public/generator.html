<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&amp;display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <title>Portify Generator : Make your own Portfolio</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }
        body{
            height: 100vh;
            background: radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.11), transparent 26rem), radial-gradient(circle at 90% 25%, rgba(139, 92, 246, 0.10), transparent 28rem), linear-gradient(145deg, #040912, #07111f 52%, #081426);
            color: white;
            font-family: Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            margin: 0;
        }
        a{
            text-decoration: none;
            color: inherit  ;
        }
        .main{
            display: flex;
        }
        .builder-main {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 75%;
        }

        .builder-details {
            width: 25%;
            padding: 20px;
            overflow-y: scroll;
            height: 100vh;
        }

        .builder-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            
        }

        .logo{
            font-size: 20px;
            font-weight: bolder;
            
        }


        .builder-section{
            padding: 10px 0;
            border-top: 1px solid #ffffff2c;
        }

        .label{
            font-size: 12px;
            color: #70839a;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .choice-btn{
            display: flex;
            flex-direction: column;
            color: white;
            padding: 11px;
            border: 1px solid #fdfdfd1f;
            border-radius: 12px;
            text-align: left;
            background-color: #0a1627;
            gap: 10px;
        }

        .choice-btn strong{
            display: block;
            font-size: 12px;
        }

        .choice-btn small{
            color: #71859c;
            font-size: 10px;
        }

        .theme-switch{
            height: 23px;
            border-radius: 8px;
            margin-bottom: 7px;
        }
        .input-group {
            display: block;
            font-size: 10px;
            color: #8092a8;
            margin-bottom: 11px;
        }

        .detailInput{
            display: block;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.133);
            background: #091525;
            color: white;
            border-radius: 10px;
            padding: 10px 9px;
            outline: none;
            margin-top: 6px;
        }

        #exportbtn{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 40px;
            padding: 12px 20px;
            border-radius: 12px;
            border-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.505);
            font-weight: 850;
            font-size: 12px;
            background:linear-gradient(135deg, #67e8f9, #60a5fa 55%, #a78bfa);
            color: black;
            cursor: pointer;
        }
        iframe {
        width: 100%;
        height: calc(100vh - 48px);
        min-height: 420px;
        border: 0;
        border-radius: 8px;
        background: #fff;
      }

    </style>
</head>
<body>
    <div class="main">
        <div class="builder-details">
            <div class="builder-brand">
                <a class="logo" href="index.html">Portify</a>
            </div>

            <div class="builder-section">
                <p class="label">
                    LAYOUT
                </p>
                <div class="choice-grid">
                    <button class="choice-btn">
                        <strong>Redz Hub</strong>
                        <small>Bloody</small>
                    </button>
                    <button class="choice-btn">
                        <strong>Greenz Hub</strong>
                        <small>Terminality</small>
                    </button>
                    <button class="choice-btn">
                        <strong>Bluez Hub</strong>
                        <small>Technicality</small>
                    </button>
                </div>
            </div>
            <div class="builder-section">
                <p class="label">
                    Theme
                </p>
                <div class="choice-grid">
                    <button class="choice-btn">
                        <strong>Ocean</strong>
                        <small class="theme-switch" style="background: linear-gradient(135deg, #0284c7, #7c3aed);"></small>
                    </button>
                    <button class="choice-btn">
                        <strong>Midnight</strong>
                        <small class="theme-switch" style="background: linear-gradient(135deg, #7dd3fc, #a78bfa);"></small>
                    </button>
                    <button class="choice-btn">
                        <strong>Redz</strong>
                        <small class="theme-switch" style="background:linear-gradient(135deg, #ea580c, #db2777);"></small>
                    </button>
                </div>
            </div>

            <div class="builder-section">
                <label class="input-group">
                    Name
                    <input id="nameInput" class="detailInput">
                </label>
                <label for="photo">Profile image</label>
                    <input type="file" id="photo" accept="image/*" class="detailInput">
                <label class="input-group">
                    Role
                    <input id="roleInput" class="detailInput">
                </label>
                <label class="input-group">
                    Bio
                    <input id="bioInput" class="detailInput">
                </label>
                <label class="input-group">
                    Location
                    <input id="locationInput" class="detailInput">
                </label>
                <label class="input-group">
                    Email
                    <input id="emailInput" class="detailInput">
                </label>
                <label class="input-group">
                    Github
                    <input id="githubInput" class="detailInput">
                </label>
                <label class="input-group">
                    LinkedIn
                    <input id="linkedinInput" class="detailInput">
                </label>
                <label class="input-group">
                    Skills
                    <input id="skillsInput" class="detailInput">
                </label>
            </div>

            <div class="builder-section">
                <button id="exportbtn">Export</button>
            </div>
            
        </div>

        <div class="builder-main">
            <iframe id="preview" title="Portfolio preview">
                
            </iframe>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const detailInput = document.querySelectorAll('.detailInput');

        
        let file= null;

        let dataUrl = ''

        let theme = document.body.dataset.theme;
        let githublink;
        let githubname;
        let linkedin_link;
        let linkedin_username;
        let location;
        let github_projects = [];
        let demo_links = [];
        let phone_no;
 

        const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); // This is so complex than I expected used AI for this new thing

        const safeName = n => n.toLowerCase().replace(/[^a-z0-9._-]/g, "-"); // This too :)

        function construct(imgSrc) {
            const name = esc($("nameInput").value);
            const bio = esc($("bioInput").value);

            const image = imgSrc
                ? `<img src="${imgSrc}" alt="Portrait of ${name}">`
                : `<div class="empty">No image yet</div>`;

            return `<!DOCTYPE html>
            <html lang="en"><head><meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${name}</title>
            <style>
            body{margin:0;font-family:Georgia,serif;background:#faf8f3;color:#1d2b24;display:grid;place-items:center;min-height:100vh;text-align:center}
            img{width:200px;height:200px;object-fit:cover;border-radius:50%;border:6px solid #e0b84c}
            h1{margin:20px 0 4px}p{margin:0;color:#55645b}
            .empty{width:200px;height:200px;border-radius:50%;background:#dde3da;display:grid;place-items:center;color:#55645b;font-size:14px;margin:auto}
            </style></head><body><div>
            ${image}
            <h1>${name}</h1><p>${bio}</p>
            </div><\/body><\/html>`;
        }

        function refresh(){
            $("preview").srcdoc = construct(dataUrl);
        }

        detailInput.forEach(input => {
            input.addEventListener('input', refresh);
        });

        $("photo").addEventListener('change', e=>{
            file = e.target.files[0];

            if(!file || !file.type.startsWith("image/") ){
                file=null;
                return;
            }

            const reader = new FileReader();
            reader.onload =()=>{
                dataUrl = reader.result;
                refresh();
            };
            
            reader.readAsDataURL(file);
        })
        
        $('exportbtn').addEventListener('click', async()=>{
            try{
                const zip = new JSZip();
                let imgPath = ''
                if(file){
                    imgPath = "images/"+ safeName(file.name);
                    zip.file(imgPath, file);
                }

                zip.file("index.html", construct(imgPath));
                const blob = await zip.generateAsync({
                    type: "blob"
                });

                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "portfolio.zip";
                a.click();
                setTimeout(() =>
                 URL.revokeObjectURL(a.href), 1000);

            } catch (error) {
                console.error("Failed to export profile:", error);
            }
        });

        refresh();

    </script>
</body>
</html>
