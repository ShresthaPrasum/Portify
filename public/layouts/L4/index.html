<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autumn Themes Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Pacifico&amp;display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

    <style>

        :root{
            --bg-color: #fcd5ab;
            --bg1-color: #ffc37a;
            --font-color: #f57959;
            --red-color: #f34c3e;
            --stem-color: #996b4c;
        }
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            color: #4e372f;
            background-color: var(--bg-color);
            font-family: "DM Sans", Arial, sans-serif;
        }

        .hero-container{
            width: 100%;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-color);
            z-index: 1;
        }

        .top-box{
            height: 37%;
            top: 0;
            right: 0;
            width: 75%;
            border-radius: 0 0 0 36% / 0 0 0 64%;
            background-color: var(--bg1-color);
            position: absolute;
            z-index: -1;
        }
        .bottom-box{
            height: 27%;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 30% 46% 0 0  / 20% 64% 0 0;
            background-color: var(--bg1-color);
            position: absolute;
            z-index: -1;
        }

        header{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        a{
            color: inherit;
            text-decoration: none;
        }

        .nav{
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            height: 100%;
        }

        .brand{
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 8px;
            width: 33%;
        }

        .logo{
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            position: relative;
            color: var(--font-color);
            font: 700 25px Georgia, serif;
            border: 1px solid var(--font-color);
        }

        .logo-name{
            font-size: 15px;
            font-weight: 800;
            line-break: auto;
            line-height: 1.1;
        }

        .logo-name small{
            font-size: 11px;
        }

        .nav-bar{
            display: flex;
            width: 33%;
            justify-content: space-between;
        }

        .nav-bar a{
            font-weight: bold;
            font-size: 16px;
        }

        .social-medias{
            width: 33%;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .leaf-branch{
            position: absolute;
            
        }

        .top-branch{
            width: 15%;
            height: auto;
            right: 8%;
            top: 4%;
            transform: rotate(3deg);
        }

        .branch-stem{
            fill: none;
            stroke-width: 1.2;
            stroke: var(--stem-color);
            stroke-linecap: round;
        }
        .red-leaf {
            fill: var(--red-color);
        }

        .hero-content{
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 80vh;
            
        }
        
        .hero-name{
            
        }

        .hero-title{
            display: block;
            font-family: "Pacifico", "Segoe Script", cursive;
            line-height: 1.1;
            color: var(--font-color);
            font-size: clamp(50px, 9vw, 110px);
            font-weight: 400;
            letter-spacing: -1px;
            
        }
        .hero-subtitle{
            color: var(--font-color);
            font-size: clamp(20px, 2.8vw, 40px);
            font-weight: 400;
            letter-spacing: -1px;
        }

        .hero-description{
            max-width: 520px;
            margin: 20px 0px;
            font-size: clamp(10px, 1vw, 14px);
            line-height:1.6;
            
        }

        .capsule-btn{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 45px;
            color: white;
            background-color: var(--font-color);
            padding: 14px 20px;
            font-size: 14px;
        }
        
        .hero-profile{
            width: 34%;
            aspect-ratio: 1/1;
            border-radius: 50%;
            background-color: #edc49e;
            border: clamp(3px, 1vw, 14px) solid var(--font-color);
        }

        .hero-profile img{
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .bottom-branch{
            width: 15%;
            height: auto;
            left: 28%;
            bottom: -5%;
            transform: rotateY(180deg);
        }
        .gold-leaf{
            fill: #ffaa21;
        }

        .left-branch{
            width: 12%;
            height: auto;
            left: -1%;
            bottom: 19%;
            transform: rotate(-7deg);
        }

        .tiny-leafs{
            position: absolute;
            left: 13%;
            top: 15%;
            width: 35px;
            height: 40px;
            transform: rotate(-20deg);
        }

        .tiny-leafs span{
            position: absolute;
            width: 40px;
            height: 60px;
            border-radius: 100% 0 100% 0;
            background-color: #f34c3e;
        }

        .tiny-leafs span:nth-child(2){
            background-color: #ff6822;
            transform: rotate(20deg);
            left: 8px;
            top: 5px;
        }
        .tiny-leafs span:nth-child(3){
            background-color: #ff9822;
            transform: rotate(40deg);
            left: 12px;
            top: 15px;
        }
    </style>
</head>
<body>
    <main>
        <section class="hero">
            <div class="hero-container">
                <div class="top-box"></div>
                <div class="bottom-box"></div>

                <header>
                    <div class="nav">
                        <a href="#home" class="brand">
                            <span class="logo">
                                P
                            </span>
                            <span class="logo-name">
                                PRASUM 
                                <br>
                                <small>SHRESTHA</small>
                            </span>
                        </a>
                        <div class="nav-bar">
                            <a href="">Home</a>
                            <a href="">About</a>
                            <a href="">Projects</a>
                            <a href="">Contact</a>
                        </div>
                        <div class="social-medias">
                            <a href="https://twitter.com">
                                <i class="fa-brands fa-x"></i>
                            </a>
                            <a href="https://github.com">
                                <i class="fa-brands fa-github"></i>
                            </a>
                            <a href="mailto:prasmshrestha@gmail.com">
                                <i class="fas fa-envelope"></i>
                            </a>
                        </div>
                    </div>
                </header>

                <svg class="leaf-branch top-branch" viewBox=" 0 0 190 112">
                    <path class="branch-stem" d="M8 12 C54 25 91 52 176 100"/>
                    <path class="red-leaf" d="M30 22 C7 5 14 -1 43 15 C39 2 51 -3 55 22 C68 6 80 10 65 31 C57 39 43 34 30 22Z"></path>
                    <path class="red-leaf" d="M66 39 C49 17 59 12 81 32 C79 17 91 15 93 39 C109 26 116 33 97 48 C87 54 76 49 66 39Z"></path>
                    <path class="red-leaf" d="M101 61 C87 39 98 33 115 54 C116 39 128 39 127 62 C144 52 151 60 130 72 C119 77 110 70 101 61Z"></path>
                    <path class="red-leaf" d="M139 82 C130 62 141 57 153 77 C157 64 167 68 163 87 C180 81 185 91 165 99 C154 101 145 91 139 82Z"></path>
                </svg>

                <svg class="leaf-branch bottom-branch" viewBox=" 0 0 190 112">
                    <path class="branch-stem" d="M8 12 C54 25 91 52 176 100"/>
                    <path class="red-leaf" d="M30 22 C7 5 14 -1 43 15 C39 2 51 -3 55 22 C68 6 80 10 65 31 C57 39 43 34 30 22Z"></path>
                    <path class="red-leaf" d="M66 39 C49 17 59 12 81 32 C79 17 91 15 93 39 C109 26 116 33 97 48 C87 54 76 49 66 39Z"></path>
                    <path class="red-leaf" d="M101 61 C87 39 98 33 115 54 C116 39 128 39 127 62 C144 52 151 60 130 72 C119 77 110 70 101 61Z"></path>
                    <path class="red-leaf" d="M139 82 C130 62 141 57 153 77 C157 64 167 68 163 87 C180 81 185 91 165 99 C154 101 145 91 139 82Z"></path>
                </svg>

                <svg class="leaf-branch left-branch" viewBox="0 0 140 160" aria-hidden="true">
                    <path class="branch-stem" d="M8 152 C44 112 66 70 105 8"></path>
                    <path class="gold-leaf" d="M24 132 C1 132 -3 118 25 116 C10 103 18 93 38 113 C42 123 34 131 24 132Z"></path>
                    <path class="gold-leaf" d="M43 105 C20 99 21 86 48 91 C37 74 47 67 62 90 C63 101 53 106 43 105Z"></path>
                    <path class="gold-leaf" d="M62 77 C43 66 48 54 69 66 C65 46 76 43 85 68 C83 78 72 82 62 77Z"></path>
                    <path class="gold-leaf" d="M82 48 C66 34 75 25 91 40 C90 21 101 20 106 44 C102 53 91 56 82 48Z"></path>
                </svg>

                <div class="tiny-leafs">
                    <span></span><span></span><span></span>
                </div>

                <div class="hero-content">
                    <div class="hero-name">
                        <h1>
                            <span class="hero-title">
                                Prasum
                            </span>
                            <span class="hero-subtitle">
                                CREATIVE DEVELOPER
                            </span>
                        </h1>

                        <p class="hero-description">
                            I am a passionate developer who loves to create beautiful and creative websites. I turn curious mind bending ideas into reality with code and creativity. 
                        </p>

                        <a href="#project" class="capsule-btn">View My Projects</a>
                    </div>
                    <div class="hero-profile">
                        <img src="image.png" alt="">
                    </div>
                </div>
            </div>
        </section>
        <section class="about" id="about"></section>
    </main>
</body>
</html>
